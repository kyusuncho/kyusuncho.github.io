# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false # we install manually below to normalize platforms first
      - name: Install gems
        # Gemfile.lock is committed from a macOS dev machine and pins
        # platform-specific native gems. Bundler 2.5.9 (BUNDLED WITH) mishandles
        # the modern precompiled Linux gems, which now publish as
        # "x86_64-linux-gnu" rather than the legacy "x86_64-linux" the lockfile
        # resolves to — so a frozen install dies looking for gems that don't
        # exist under that name (e.g. ffi-1.17.4-x86_64-linux). Building the
        # native gems from source instead of using precompiled binaries makes
        # the install immune to that platform-naming mismatch.
        run: |
          bundle config set --local frozen false
          bundle config set --local force_ruby_platform true
          bundle install --jobs 4 --retry 3
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
