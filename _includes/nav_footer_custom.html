<script>
  (function () {
    if (window.__jtdThemeToggleBound) return; /* this include renders twice (sidebar + mobile footer) */
    window.__jtdThemeToggleBound = true;

    function apply(theme) {
      jtd.setTheme(theme);
      try { localStorage.setItem('jtd-theme', theme); } catch (e) {}
    }

    jtd.addEvent(document, 'DOMContentLoaded', function () {
      var buttons = document.querySelectorAll('.js-toggle-dark-mode');
      for (var i = 0; i < buttons.length; i++) {
        jtd.addEvent(buttons[i], 'click', function () {
          apply(jtd.getTheme() === 'dark' ? 'light' : 'dark');
        });
      }
    });
  })();
</script>
