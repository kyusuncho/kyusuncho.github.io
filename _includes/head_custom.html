<script>
  /*
    Restore the visitor's saved light/dark preference before the body paints.
    jtd is defined by just-the-docs.js (loaded earlier in <head>); the swappable
    stylesheet is the first <link rel="stylesheet">, which is what setTheme targets.
  */
  (function () {
    try {
      var theme = localStorage.getItem('jtd-theme');
      if (theme) jtd.setTheme(theme);
    } catch (e) {}
  })();
</script>

  Favicon. The theme's own `favicon.html` already links the root `/favicon.ico`

  what current browsers pick.
