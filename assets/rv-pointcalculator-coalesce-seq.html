<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>큐 병합과 야간 전체 리플레이 — from_date 트리거의 두 경로</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Nanum Myeongjo', serif;
      --font-mono:  'Geist Mono', 'Apple SD Gothic Neo', 'Noto Sans KR', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
    svg .legend-label { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.12em; }
    svg .node-name { font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
    svg .sublabel { font-family: var(--font-mono); font-size: 12px; }
    svg .msg-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; }
    svg .section { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; }
    /* Embed mode: the blog iframes this file with #embed to hide the page chrome (CSS-only, no JS). */
    body:has(.frame:target) { padding: 0; }
    .frame:target { max-width: none; }
    .frame:target .eyebrow, .frame:target h1 { display: none; }
    .frame:target svg { min-width: 0; height: 100vh; }
  </style>
</head>
<body>
  <div class="frame" id="embed">
    <p class="eyebrow">Sequence · RV Badminton PointCalculator</p>
    <h1>큐 병합과 야간 전체 리플레이 — from_date 트리거의 두 경로</h1>

    <svg viewBox="0 0 960 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rv-coalesce-title rv-coalesce-desc">
      <title id="rv-coalesce-title">큐 병합과 야간 전체 리플레이 — from_date 트리거의 두 경로</title>
      <desc id="rv-coalesce-desc">위쪽 흐름에서는 백엔드 서비스들이 날짜 단위 재계산 요청을 큐에 넣고, 큐는 1.5초 디바운스 뒤 가장 이른 날짜 하나로 병합해 PointCalculator에 POST /recalc를 한 번만 보낸다. 아래쪽 흐름에서는 매일 04:00 KST에 야간 스케줄러가 leaderboard:rv를 스냅샷하고 epoch부터의 전체 리플레이를 큐에 넣은 뒤, 성공 콜백에서 스냅샷과 재구축 결과를 비교해 드리프트 리포트를 남긴다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ═══ Lifelines ═══ -->
      <line x1="112" y1="104" x2="112" y2="644" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="296" y1="104" x2="296" y2="644" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="104" x2="480" y2="644" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="664" y1="104" x2="664" y2="644" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="848" y1="104" x2="848" y2="644" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ═══ Section dividers ═══ -->
      <text x="40" y="124" class="section" fill="#4f5d75">A · 매치 버스트</text>
      <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(45,49,66,0.14)" stroke-width="0.8" stroke-dasharray="6,4"/>
      <text x="40" y="416" class="section" fill="#4f5d75">B · 매일 04:00 KST · 야간 전체 리플레이 (test/prod)</text>

      <!-- ═══ Activation bars ═══ -->
      <rect x="108" y="140" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="176" width="8" height="200" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="660" y="272" width="8" height="88" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="844" y="316" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="292" y="428" width="8" height="200" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="844" y="436" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="480" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="660" y="512" width="8" height="52" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="844" y="548" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="844" y="620" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ═══ Messages — flow A ═══ -->
      <!-- m1: Backend → Queue : enqueue(7/12, MATCH_SAVED) -->
      <line x1="116" y1="144" x2="476" y2="144" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="196" y="116" width="200" height="20" rx="2" fill="#f5f5f5"/>
      <text x="296" y="130" class="msg-label" fill="#4f5d75" text-anchor="middle">enqueue(07-12, MATCH_SAVED)</text>

      <!-- m2: Backend → Queue : enqueue(7/05, MATCH_EDITED) -->
      <line x1="116" y1="180" x2="476" y2="180" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="192" y="152" width="208" height="20" rx="2" fill="#f5f5f5"/>
      <text x="296" y="166" class="msg-label" fill="#4f5d75" text-anchor="middle">enqueue(07-05, MATCH_EDITED)</text>

      <!-- m3: Queue self : 1.5s debounce → min(day) (headline, accent) -->
      <path d="M 484,216 H 516 Q 524,216 524,224 V 232 Q 524,240 516,240 H 488"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="536" y="233" class="msg-label" fill="#eb6c36">1.5s 디바운스 → min(day) = 07-05</text>

      <!-- m4: Queue → PC : POST /recalc {from_date} -->
      <line x1="484" y1="276" x2="660" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="500" y="248" width="144" height="20" rx="2" fill="#f5f5f5"/>
      <text x="572" y="262" class="msg-label" fill="#2e5aa8" text-anchor="middle">POST /recalc 07-05</text>

      <!-- m5: PC → Redis : rebuild leaderboards -->
      <line x1="668" y1="320" x2="844" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="704" y="292" width="104" height="20" rx="2" fill="#f5f5f5"/>
      <text x="756" y="306" class="msg-label" fill="#4f5d75" text-anchor="middle">리더보드 재구축</text>

      <!-- m6: PC --> Queue : 200 OK -->
      <line x1="660" y1="356" x2="484" y2="356" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="540" y="328" width="64" height="20" rx="2" fill="#f5f5f5"/>
      <text x="572" y="342" class="msg-label" fill="#4f5d75" text-anchor="middle">200 OK</text>

      <!-- ═══ Messages — flow B ═══ -->
      <!-- m7: Scheduler → Redis : snapshot leaderboard:rv -->
      <line x1="300" y1="440" x2="844" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="692" y="412" width="128" height="20" rx="2" fill="#f5f5f5"/>
      <text x="756" y="426" class="msg-label" fill="#4f5d75" text-anchor="middle">leaderboard:rv 스냅샷</text>

      <!-- m8: Scheduler → Queue : enqueue(EPOCH, NIGHTLY, afterSuccess) -->
      <line x1="300" y1="476" x2="476" y2="476" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="304" y="448" width="168" height="20" rx="2" fill="#f5f5f5"/>
      <text x="388" y="462" class="msg-label" fill="#4f5d75" text-anchor="middle">enqueue(EPOCH, 콜백)</text>

      <!-- m9: Queue → PC : POST /recalc 1970-01-01 -->
      <line x1="484" y1="516" x2="660" y2="516" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="492" y="488" width="160" height="20" rx="2" fill="#f5f5f5"/>
      <text x="572" y="502" class="msg-label" fill="#2e5aa8" text-anchor="middle">POST /recalc 1970-01-01</text>

      <!-- m10: PC → Redis : full rebuild -->
      <line x1="668" y1="552" x2="844" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="712" y="524" width="88" height="20" rx="2" fill="#f5f5f5"/>
      <text x="756" y="538" class="msg-label" fill="#4f5d75" text-anchor="middle">전체 재구축</text>

      <!-- m11: Queue --> Scheduler : afterSuccess() -->
      <line x1="476" y1="588" x2="300" y2="588" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="336" y="560" width="104" height="20" rx="2" fill="#f5f5f5"/>
      <text x="388" y="574" class="msg-label" fill="#4f5d75" text-anchor="middle">afterSuccess()</text>

      <!-- m12: Scheduler → Redis : compare → drift report (accent) -->
      <line x1="300" y1="624" x2="844" y2="624" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="452" y="596" width="240" height="20" rx="2" fill="#f5f5f5"/>
      <text x="572" y="610" class="msg-label" fill="#eb6c36" text-anchor="middle">스냅샷 비교 → 드리프트 리포트 INFO/WARN</text>

      <!-- ═══ Actors ═══ -->
      <rect x="40" y="48" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="48" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="112" y="74" class="node-name" fill="#2d3142" text-anchor="middle">Backend 서비스</text>
      <text x="112" y="94" class="sublabel" fill="#4f5d75" text-anchor="middle">match · attendance</text>

      <rect x="224" y="48" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="48" width="144" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="296" y="74" class="node-name" fill="#2d3142" text-anchor="middle">야간 스케줄러</text>
      <text x="296" y="94" class="sublabel" fill="#4f5d75" text-anchor="middle">04:00 Asia/Seoul</text>

      <rect x="408" y="48" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="48" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="74" class="node-name" fill="#2d3142" text-anchor="middle">Queue</text>
      <text x="480" y="94" class="sublabel" fill="#4f5d75" text-anchor="middle">single consumer</text>

      <rect x="592" y="48" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="48" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="664" y="74" class="node-name" fill="#2d3142" text-anchor="middle">PointCalculator</text>
      <text x="664" y="94" class="sublabel" fill="#4f5d75" text-anchor="middle">fastapi</text>

      <rect x="776" y="48" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="48" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="848" y="74" class="node-name" fill="#2d3142" text-anchor="middle">Redis</text>
      <text x="848" y="94" class="sublabel" fill="#4f5d75" text-anchor="middle">결과 저장소</text>

      <!-- ═══ Legend ═══ -->
      <line x1="40" y1="672" x2="920" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="700" class="legend-label" fill="#4f5d75">LEGEND</text>
      <line x1="132" y1="695" x2="172" y2="695" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="184" y="700" class="sublabel" fill="#4f5d75">HTTP 호출</text>
      <line x1="288" y1="695" x2="328" y2="695" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="340" y="700" class="sublabel" fill="#4f5d75">내부 호출</text>
      <line x1="444" y1="695" x2="484" y2="695" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="496" y="700" class="sublabel" fill="#4f5d75">비동기 투입</text>
      <line x1="612" y1="695" x2="652" y2="695" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="664" y="700" class="sublabel" fill="#4f5d75">응답 / 콜백</text>
      <line x1="772" y1="695" x2="812" y2="695" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="824" y="700" class="sublabel" fill="#4f5d75">핵심 단계</text>
    </svg>
  </div>
</body>
</html>
